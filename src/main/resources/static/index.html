<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MIX CS2 - Balanceador de Partidas</title>
  <!-- Bootstrap 5 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-dark text-light min-vh-100 py-4">

<div class="container" style="max-width: 800px;">

  <!-- CABEÇALHO -->
  <div class="text-center mb-4">
    <h1 class="display-5 fw-bold text-warning"><i class="bi bi-crosshair"></i> MIX CS2</h1>
    <p class="text-secondary">Votação de Tiers e Balanceamento Automático</p>
  </div>

  <!-- FASE 1: ENTRADA E LOBBY -->
  <div id="faseLobby" class="card border-secondary bg-body-tertiary shadow">
    <div class="card-header d-flex justify-content-between align-items-center border-secondary">
      <h5 class="mb-0"><i class="bi bi-people-fill"></i> Sala de Espera</h5>
      <span class="badge bg-warning text-dark fs-6" id="countBadge">0/10</span>
    </div>

    <div class="card-body">
      <div class="input-group mb-3">
        <input type="text" id="nome" class="form-control" placeholder="Digite seu Nick no CS2...">
        <button class="btn btn-warning fw-bold" onclick="entrar()"><i class="bi bi-plus-circle"></i> Entrar</button>
      </div>

      <h6 class="text-secondary mt-3">Jogadores na Sala:</h6>
      <ul id="listaLobby" class="list-group list-group-flush border rounded border-secondary">
        <!-- Jogadores entram aqui -->
      </ul>

      <div class="text-end mt-3">
        <button class="btn btn-outline-danger btn-sm" onclick="limparLobby()"><i class="bi bi-trash"></i> Resetar Lobby</button>
      </div>
    </div>
  </div>

  <!-- FASE 2: VOTAÇÃO -->
  <div id="faseVotacao" class="card border-secondary bg-body-tertiary shadow" style="display: none;">
    <div class="card-header border-secondary">
      <h5 class="mb-0"><i class="bi bi-star-fill text-warning"></i> Fase de Votação</h5>
    </div>
    <div class="card-body">
      <label for="meuUsuario" class="form-label">Quem é você?</label>
      <select id="meuUsuario" class="form-select mb-3" onchange="renderizarVotacao()">
        <option value="">-- Selecione seu Nick --</option>
      </select>

      <div id="painelVotacao"></div>

      <!-- STATUS DA VOTAÇÃO GERAL -->
      <div id="boxStatusVotacao" class="text-center mt-4 p-3 bg-dark rounded border border-secondary" style="display: none;">
        <p class="mb-2">Votações concluídas no lobby: <strong id="contadorVotosConcluidos" class="text-info">0/10</strong></p>
        <button id="btnConfirmarEGerar" class="btn btn-success w-100 fw-bold py-2" onclick="irParaTimes()" disabled>
          <i class="bi bi-lock-fill"></i> Aguardando todos os 10 jogadores votarem...
        </button>
      </div>

      <div class="text-end mt-3">
        <button class="btn btn-outline-danger btn-sm" onclick="limparLobby()"><i class="bi bi-trash"></i> Resetar Lobby</button>
      </div>
    </div>
  </div>

  <!-- FASE 3: TIMES GERADOS -->
  <div id="faseFormacao" class="card border-secondary bg-body-tertiary shadow" style="display: none;">
    <div class="card-header border-secondary text-center">
      <h4 class="mb-0"><i class="bi bi-trophy-fill text-warning"></i> Confronto Definido</h4>
    </div>
    <div class="card-body">
      <div class="row g-3">
        <!-- TIME CT -->
        <div class="col-md-6">
          <div class="card border-info bg-dark">
            <div class="card-header bg-info text-dark fw-bold text-center">
              <i class="bi bi-shield-fill"></i> Counter-Terrorists
            </div>
            <ul id="timeCT" class="list-group list-group-flush"></ul>
          </div>
        </div>

        <!-- TIME TR -->
        <div class="col-md-6">
          <div class="card border-warning bg-dark">
            <div class="card-header bg-warning text-dark fw-bold text-center">
              <i class="bi bi-fire"></i> Terrorists
            </div>
            <ul id="timeTR" class="list-group list-group-flush"></ul>
          </div>
        </div>
      </div>

      <div class="text-center mt-4">
        <button class="btn btn-primary me-2" onclick="copiarParaDiscord()"><i class="bi bi-discord"></i> Copiar para Discord</button>
        <button class="btn btn-outline-light" onclick="limparLobby()"><i class="bi bi-arrow-clockwise"></i> Nova Partida</button>
      </div>
    </div>
  </div>

</div>

<!-- Bootstrap JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
