<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>MIX CS2 - Votação e Balanceamento</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>

<div class="card">
  <h2>Lobby CS2</h2>

  <!-- FASE 1: ENTRADA E LOBBY (Sempre visível inicialmente) -->
  <div class="lobby-box">
    <div class="lobby-header">
      <span class="lobby-title">Aguardando Jogadores</span>
      <span class="lobby-badge" id="countBadge">0/10</span>
    </div>

    <div class="input-group">
      <input type="text" id="nome" placeholder="Digite seu Nick no CS">
      <button class="btn-entrar" onclick="entrar()">Entrar</button>
    </div>

    <div class="lobby-confirmados">
      <p style="margin: 5px 0; font-size: 13px; color: #8b949e;">Jogadores na sala:</p>
      <ul id="listaLobby"></ul>
    </div>

    <div style="text-align: right; margin-top: 10px;">
      <button class="btn-reset-small" onclick="limparLobby()">🗑️ Limpar Lobby</button>
    </div>
  </div>

  <!-- FASE 2: VOTAÇÃO (Só aparece quando o lobby atinge 10/10) -->
  <div id="faseVotacao" class="section" style="display: none;">
    <h3>Área de Votação</h3>
    <label for="meuUsuario">Selecione QUEM é você:</label>
    <select id="meuUsuario" onchange="renderizarVotacao()">
      <option value="">-- Selecione seu Nick --</option>
    </select>

    <div id="painelVotacao" style="margin-top: 15px;"></div>
  </div>

  <!-- FASE 3: FORMAÇÃO DE TIMES (Só aparece quando o lobby atinge 10/10) -->
  <div id="faseFormacao" class="section" style="display: none;">
    <h3>Formação de Times</h3>
    <button class="btn-balancear" onclick="balancear()">⚡ Balanceamento Automático</button>
    <button class="btn-draft" onclick="iniciarDraft()">👑 Modo Capitães (Draft)</button>

    <!-- PAINEL DO MODO DRAFT -->
    <div id="painelDraft" style="display: none; margin-top: 20px; text-align: left;">
      <div id="statusTurno" class="turn-highlight"></div>
      <p><strong>Jogadores Disponíveis:</strong></p>
      <ul id="listaDisponiveisDraft"></ul>
    </div>

    <!-- RESULTADO DOS TIMES -->
    <div class="times-container" id="resultado" style="display:none;">
      <div class="time-box">
        <h4 class="ct-title" id="nomeTime1">Counter-Terrorists</h4>
        <ul id="timeCT"></ul>
      </div>
      <div class="time-box">
        <h4 class="tr-title" id="nomeTime2">Terrorists</h4>
        <ul id="timeTR"></ul>
      </div>
    </div>

    <!-- BOTÃO DISCORD -->
    <div id="discord-container" style="display: none; margin-top: 15px;">
      <button class="btn-discord" onclick="copiarParaDiscord()">📋 Copiar para o Discord</button>
    </div>
  </div>
</div>

<script>
  let todosJogadores = [];
  let ultimaPartida = null;
  let estadoDraftAtual = null;
  let meusVotosLocais = {};

  async function carregar() {
    const res = await fetch('/api/jogadores');
    todosJogadores = await res.json();

    const total = todosJogadores.length;
    document.getElementById('countBadge').innerText = `${total}/10`;

    const listaLobby = document.getElementById('listaLobby');
    listaLobby.innerHTML = '';

    const selectUsuario = document.getElementById('meuUsuario');
    const usuarioSelecionado = selectUsuario.value;
    selectUsuario.innerHTML = '<option value="">-- Selecione seu Nick --</option>';

    todosJogadores.forEach(j => {
      listaLobby.innerHTML += `<li class="player-tag"><span>${j.nome}</span></li>`;
      selectUsuario.innerHTML += `<option value="${j.nome}">${j.nome}</option>`;
    });

    selectUsuario.value = usuarioSelecionado;

    // LÓGICA DE CONTROLE DE FASES:
    // Se tiver 10 jogadores, exibe a Votação e Formação; caso contrário, esconde.
    if (total === 10) {
      document.getElementById('faseVotacao').style.display = 'block';
      document.getElementById('faseFormacao').style.display = 'block';
      renderizarVotacao();
    } else {
      document.getElementById('faseVotacao').style.display = 'none';
      document.getElementById('faseFormacao').style.display = 'none';
    }
  }

  async function entrar() {
    const nomeInput = document.getElementById('nome');
    const nome = nomeInput.value.trim();
    if (!nome) return alert('Digite seu nick!');

    const res = await fetch(`/api/entrar?nome=${encodeURIComponent(nome)}`, { method: 'POST' });
    if (!res.ok) {
      const err = await res.text();
      return alert(err);
    }
    nomeInput.value = '';
    carregar();
  }

  function renderizarVotacao() {
    const meuNick = document.getElementById('meuUsuario').value;
    const painel = document.getElementById('painelVotacao');
    painel.innerHTML = '';

    if (!meuNick) {
      painel.innerHTML = '<p style="color: #8f98a0; text-align: center;">Selecione seu nick acima para votar nos jogadores.</p>';
      return;
    }

    const outros = todosJogadores.filter(j => j.nome.toLowerCase() !== meuNick.toLowerCase());

    let htmlForm = '<div class="cards-voto-grid">';
    outros.forEach(j => {
      const votoAtual = meusVotosLocais[j.nome];
      const jaVotou = votoAtual !== undefined;

      htmlForm += `
        <div class="card-voto-item ${jaVotou ? 'voto-confirmado' : ''}">
          <div class="voto-header">
            <span class="voto-nome">${j.nome}</span>
            ${jaVotou ? '<span class="badge-voted">✓ Votado</span>' : '<span class="badge-pending">Pendente</span>'}
          </div>
          <div class="tier-buttons">
            <button class="btn-tier t1 ${votoAtual === 1.0 ? 'active' : ''}" onclick="selecionarTier('${j.nome}', 1.0)">T1 <small>(GC A+)</small></button>
            <button class="btn-tier t2 ${votoAtual === 2.5 ? 'active' : ''}" onclick="selecionarTier('${j.nome}', 2.5)">T2 <small>(GC A)</small></button>
            <button class="btn-tier t3 ${votoAtual === 3.5 ? 'active' : ''}" onclick="selecionarTier('${j.nome}', 3.5)">T3 <small>(GC B)</small></button>
            <button class="btn-tier t4 ${votoAtual === 5.0 ? 'active' : ''}" onclick="selecionarTier('${j.nome}', 5.0)">T4 <small>(GC C)</small></button>
          </div>
        </div>
      `;
    });
    htmlForm += '</div>';

    const totalOutros = outros.length;
    const totalVotados = Object.keys(meusVotosLocais).length;

    htmlForm += `
      <div style="margin-top: 15px;">
        <button class="btn-votar" onclick="enviarTodosVotos()" ${totalVotados < totalOutros ? 'disabled style="opacity: 0.5; cursor: not-allowed;"' : ''}>
          🚀 Confirmar Votos (${totalVotados}/${totalOutros})
        </button>
      </div>
    `;

    painel.innerHTML = htmlForm;
  }

  function selecionarTier(alvo, tier) {
    if (meusVotosLocais[alvo] !== undefined) {
      alert(`Você já registrou o voto para ${alvo}!`);
      return;
    }
    meusVotosLocais[alvo] = tier;
    renderizarVotacao();
  }

  async function enviarTodosVotos() {
    const meuNick = document.getElementById('meuUsuario').value;
    const outros = todosJogadores.filter(j => j.nome.toLowerCase() !== meuNick.toLowerCase());

    if (Object.keys(meusVotosLocais).length < outros.length) {
      return alert("Vote no Tier de todos os jogadores antes de confirmar!");
    }

    for (const alvo in meusVotosLocais) {
      const tier = meusVotosLocais[alvo];
      await fetch(`/api/votar?alvo=${encodeURIComponent(alvo)}&tier=${tier}`, { method: 'POST' });
    }

    alert('🎉 Todos os votos foram registrados!');
    carregar();
  }

  async function balancear() {
    document.getElementById('painelDraft').style.display = 'none';
    const res = await fetch('/api/balancear');
    if (!res.ok) {
      const err = await res.text();
      return alert('Aviso: ' + err);
    }
    const times = await res.json();
    ultimaPartida = times;

    document.getElementById('nomeTime1').innerText = "Counter-Terrorists";
    document.getElementById('nomeTime2').innerText = "Terrorists";
    document.getElementById('resultado').style.display = 'flex';
    document.getElementById('discord-container').style.display = 'block';

    const ctList = document.getElementById('timeCT');
    const trList = document.getElementById('timeTR');
    ctList.innerHTML = '';
    trList.innerHTML = '';

    times[0].jogadores.forEach(j => ctList.innerHTML += `<li>${j.nome}</li>`);
    times[1].jogadores.forEach(j => trList.innerHTML += `<li>${j.nome}</li>`);
  }

  async function iniciarDraft() {
    const res = await fetch('/api/draft/iniciar', { method: 'POST' });
    if (!res.ok) {
      const err = await res.text();
      return alert('Aviso: ' + err);
    }
    const state = await res.json();
    atualizarTelaDraft(state);
  }

  async function pickJogador(escolhido) {
    if (!estadoDraftAtual) return;
    const capitaoTurno = estadoDraftAtual.turnoAtual;

    const res = await fetch(`/api/draft/pick?capitao=${encodeURIComponent(capitaoTurno)}&escolhido=${encodeURIComponent(escolhido)}`, { method: 'POST' });
    if (!res.ok) {
      const err = await res.text();
      return alert('Erro no Pick: ' + err);
    }
    const state = await res.json();
    atualizarTelaDraft(state);
  }

  function atualizarTelaDraft(state) {
    estadoDraftAtual = state;
    document.getElementById('painelDraft').style.display = 'block';
    document.getElementById('resultado').style.display = 'flex';

    document.getElementById('nomeTime1').innerText = state.time1.nome;
    document.getElementById('nomeTime2').innerText = state.time2.nome;

    const ctList = document.getElementById('timeCT');
    const trList = document.getElementById('timeTR');
    ctList.innerHTML = '';
    trList.innerHTML = '';

    state.time1.jogadores.forEach(j => ctList.innerHTML += `<li>${j.nome}</li>`);
    state.time2.jogadores.forEach(j => trList.innerHTML += `<li>${j.nome}</li>`);

    const statusDiv = document.getElementById('statusTurno');
    const listaDisp = document.getElementById('listaDisponiveisDraft');
    listaDisp.innerHTML = '';

    if (state.finalizado) {
      statusDiv.innerHTML = "✅ **Draft Finalizado!** Times prontos para o confronto.";
      document.getElementById('discord-container').style.display = 'block';
      document.getElementById('painelDraft').style.display = 'none';

      ultimaPartida = [
        { nome: state.time1.nome, jogadores: state.time1.jogadores },
        { nome: state.time2.nome, jogadores: state.time2.jogadores }
      ];
    } else {
      statusDiv.innerHTML = `👉 Vez do Capitão: <strong>${state.turnoAtual}</strong> escolher!`;

      state.disponiveis.forEach(j => {
        listaDisp.innerHTML += `
          <li>
            <span>${j.nome}</span>
            <button class="btn-pick" onclick="pickJogador('${j.nome}')">Puxar ${j.nome}</button>
          </li>
        `;
      });
    }
  }

  function copiarParaDiscord() {
    if (!ultimaPartida) return;

    const ct = ultimaPartida[0];
    const tr = ultimaPartida[1];

    let texto = `⚔️ **PARTIDA CS2 GERADA** ⚔️\n\n`;
    texto += `🛡️ **${ct.nome.toUpperCase()}**\n`;
    if (ct && ct.jogadores) ct.jogadores.forEach(j => texto += `• ${j.nome}\n`);

    texto += `\n💣 **${tr.nome.toUpperCase()}**\n`;
    if (tr && tr.jogadores) tr.jogadores.forEach(j => texto += `• ${j.nome}\n`);

    navigator.clipboard.writeText(texto).then(() => {
      alert("Escalação copiada para a área de transferência!");
    });
  }

  async function limparLobby() {
    if (!confirm("Tem certeza que deseja limpar todo o lobby?")) return;

    const res = await fetch('/api/resetar', { method: 'POST' });
    const msg = await res.text();
    alert(msg);

    meusVotosLocais = {};
    document.getElementById('resultado').style.display = 'none';
    document.getElementById('painelDraft').style.display = 'none';
    document.getElementById('discord-container').style.display = 'none';

    carregar();
  }

  carregar();
</script>
</body>
</html>
