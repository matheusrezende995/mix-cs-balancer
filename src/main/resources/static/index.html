<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MIX CS2 - Balanceador de Partidas</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Ícones do Bootstrap -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-dark text-light min-vh-100 py-4">

<div class="container" style="max-width: 850px;">

  <!-- CABEÇALHO -->
  <div class="text-center mb-4">
    <h1 class="display-5 fw-bold text-warning"><i class="bi bi-crosshair"></i> MIX CS2</h1>
    <p class="text-secondary">Votação de Tiers e Balanceamento Automático</p>
  </div>

  <!-- FASE 1: ENTRADA E LOBBY -->
  <div id="faseLobby" class="card border-secondary bg-body-tertiary shadow">
    <div class="card-header d-flex justify-content-between align-items-center border-secondary">
      <h5 class="mb-0"><i class="bi bi-people-fill"></i> Sala de Espera</h5>
      <span class="badge bg-warning text-dark fs-6" id="countBadge">0/10</span>
    </div>

    <div class="card-body">
      <div class="input-group mb-3">
        <input type="text" id="nome" class="form-control" placeholder="Digite seu Nick no CS2..." onkeypress="if(event.key==='Enter') entrar()">
        <button class="btn btn-warning fw-bold" onclick="entrar()"><i class="bi bi-plus-circle"></i> Entrar</button>
      </div>

      <h6 class="text-secondary mt-3">Jogadores na Sala:</h6>
      <ul id="listaLobby" class="list-group border rounded border-secondary mb-3">
        <!-- Jogadores entram aqui -->
      </ul>

      <div class="text-end">
        <button class="btn btn-outline-danger btn-sm" onclick="limparLobby()"><i class="bi bi-trash"></i> Resetar Lobby</button>
      </div>
    </div>
  </div>

  <!-- FASE 2: VOTAÇÃO -->
  <div id="faseVotacao" class="card border-secondary bg-body-tertiary shadow" style="display: none;">
    <div class="card-header border-secondary">
      <h5 class="mb-0"><i class="bi bi-star-fill text-warning"></i> Fase de Votação</h5>
    </div>
    <div class="card-body">
      <label for="meuUsuario" class="form-label fw-bold">Quem é você na sala?</label>
      <select id="meuUsuario" class="form-select mb-4" onchange="renderizarVotacao()">
        <option value="">-- Selecione seu Nick --</option>
      </select>

      <div id="painelVotacao"></div>

      <!-- STATUS DA VOTAÇÃO GERAL -->
      <div id="boxStatusVotacao" class="text-center mt-4 p-3 bg-dark rounded border border-secondary" style="display: none;">
        <p class="mb-2">Votações concluídas no lobby: <strong id="contadorVotosConcluidos" class="text-info">0/10</strong></p>
        <button id="btnConfirmarEGerar" class="btn btn-success w-100 fw-bold py-2" onclick="irParaTimes()" disabled>
          <i class="bi bi-lock-fill"></i> Aguardando todos os 10 jogadores votarem...
        </button>
      </div>

      <div class="text-end mt-3">
        <button class="btn btn-outline-danger btn-sm" onclick="limparLobby()"><i class="bi bi-trash"></i> Resetar Lobby</button>
      </div>
    </div>
  </div>

  <!-- FASE 3: TIMES GERADOS -->
  <div id="faseFormacao" class="card border-secondary bg-body-tertiary shadow" style="display: none;">
    <div class="card-header border-secondary text-center">
      <h4 class="mb-0"><i class="bi bi-trophy-fill text-warning"></i> Confronto Definido</h4>
    </div>
    <div class="card-body">
      <div class="row g-3">
        <!-- TIME CT -->
        <div class="col-md-6">
          <div class="card border-info bg-dark">
            <div class="card-header bg-info text-dark fw-bold text-center">
              <i class="bi bi-shield-fill"></i> Counter-Terrorists
            </div>
            <ul id="timeCT" class="list-group list-group-flush"></ul>
          </div>
        </div>

        <!-- TIME TR -->
        <div class="col-md-6">
          <div class="card border-warning bg-dark">
            <div class="card-header bg-warning text-dark fw-bold text-center">
              <i class="bi bi-fire"></i> Terrorists
            </div>
            <ul id="timeTR" class="list-group list-group-flush"></ul>
          </div>
        </div>
      </div>

      <div class="text-center mt-4">
        <button class="btn btn-primary me-2" onclick="copiarParaDiscord()"><i class="bi bi-discord"></i> Copiar para Discord</button>
        <button class="btn btn-outline-light" onclick="limparLobby()"><i class="bi bi-arrow-clockwise"></i> Nova Partida</button>
      </div>
    </div>
  </div>

</div>

<!-- LÓGICA JAVASCRIPT INTEGRADA -->
<script>
  let todosJogadores = [];
  let ultimaPartida = null;
  let meusVotosLocais = {};
  let intervalVotos = null;

  async function carregar() {
    try {
      const res = await fetch('/api/jogadores');
      todosJogadores = await res.json();

      const total = todosJogadores.length;
      document.getElementById('countBadge').innerText = `${total}/10`;

      const listaLobby = document.getElementById('listaLobby');
      listaLobby.innerHTML = '';

      const selectUsuario = document.getElementById('meuUsuario');
      const usuarioSelecionado = selectUsuario.value;
      selectUsuario.innerHTML = '<option value="">-- Selecione seu Nick --</option>';

      if (total === 0) {
        listaLobby.innerHTML = '<li class="list-group-item text-secondary text-center">Nenhum jogador na sala ainda.</li>';
      } else {
        todosJogadores.forEach(j => {
          listaLobby.innerHTML += `<li class="list-group-item bg-dark text-light border-secondary d-flex justify-content-between align-items-center"><span><i class="bi bi-person-fill text-warning me-2"></i>${j.nome}</span></li>`;
          selectUsuario.innerHTML += `<option value="${j.nome}">${j.nome}</option>`;
        });
      }

      selectUsuario.value = usuarioSelecionado;

      const faseLobby = document.getElementById('faseLobby');
      const faseVotacao = document.getElementById('faseVotacao');
      const faseFormacao = document.getElementById('faseFormacao');

      if (total < 10) {
        faseLobby.style.display = 'block';
        faseVotacao.style.display = 'none';
        faseFormacao.style.display = 'none';
        pararChecagemVotos();
      } else if (total === 10 && !ultimaPartida) {
        faseLobby.style.display = 'none';
        faseVotacao.style.display = 'block';
        faseFormacao.style.display = 'none';
        renderizarVotacao();
        iniciarChecagemVotos();
      } else {
        faseLobby.style.display = 'none';
        faseVotacao.style.display = 'none';
        faseFormacao.style.display = 'block';
        pararChecagemVotos();
      }
    } catch (e) {
      console.error("Erro ao carregar dados do lobby:", e);
    }
  }

  async function entrar() {
    const nomeInput = document.getElementById('nome');
    const nome = nomeInput.value.trim();
    if (!nome) return alert('Digite seu nick!');

    const res = await fetch(`/api/entrar?nome=${encodeURIComponent(nome)}`, { method: 'POST' });
    if (!res.ok) {
      const err = await res.text();
      return alert(err);
    }
    nomeInput.value = '';
    carregar();
  }

  function renderizarVotacao() {
    const meuNick = document.getElementById('meuUsuario').value;
    const painel = document.getElementById('painelVotacao');
    const boxStatus = document.getElementById('boxStatusVotacao');
    painel.innerHTML = '';

    if (!meuNick) {
      painel.innerHTML = '<p class="text-secondary text-center my-4"><i class="bi bi-info-circle me-1"></i> Selecione seu nick acima para liberar os cards de votação.</p>';
      boxStatus.style.display = 'none';
      return;
    }

    boxStatus.style.display = 'block';
    const outros = todosJogadores.filter(j => j.nome.toLowerCase() !== meuNick.toLowerCase());

    let htmlForm = '<div class="row g-3">';
    outros.forEach(j => {
      const votoAtual = meusVotosLocais[j.nome];
      const jaVotou = votoAtual !== undefined;

      htmlForm += `
        <div class="col-md-6">
          <div class="card border-secondary bg-dark text-light p-3">
            <div class="d-flex justify-content-between align-items-center mb-2">
              <strong class="fs-5">${j.nome}</strong>
              ${jaVotou ? '<span class="badge bg-success"><i class="bi bi-check-lg"></i> Votado</span>' : '<span class="badge bg-warning text-dark">Pendente</span>'}
            </div>
            <div class="btn-group w-100" role="group">
              <button class="btn ${votoAtual === 1.0 ? 'btn-primary' : 'btn-outline-primary'} btn-sm px-1" onclick="selecionarTier('${j.nome}', 1.0)">Tier 1</button>
              <button class="btn ${votoAtual === 2.0 ? 'btn-info' : 'btn-outline-info'} btn-sm px-1" onclick="selecionarTier('${j.nome}', 2.0)">Tier 2</button>
              <button class="btn ${votoAtual === 3.0 ? 'btn-success' : 'btn-outline-success'} btn-sm px-1" onclick="selecionarTier('${j.nome}', 3.0)">Tier 3</button>
              <button class="btn ${votoAtual === 4.0 ? 'btn-warning' : 'btn-outline-warning'} btn-sm px-1" onclick="selecionarTier('${j.nome}', 4.0)">Tier 4</button>
              <button class="btn ${votoAtual === 5.0 ? 'btn-danger' : 'btn-outline-danger'} btn-sm px-1" onclick="selecionarTier('${j.nome}', 5.0)">Tier 5</button>
            </div>
          </div>
        </div>
      `;
    });
    htmlForm += '</div>';

    const totalOutros = outros.length;
    const totalVotadosLocal = Object.keys(meusVotosLocais).length;

    htmlForm += `
      <div class="mt-3">
        <button class="btn btn-warning w-100 fw-bold" onclick="enviarMeusVotos()" ${totalVotadosLocal < totalOutros ? 'disabled' : ''}>
          <i class="bi bi-floppy-fill"></i> Confirmar Meus Votos (${totalVotadosLocal}/${totalOutros})
        </button>
      </div>
    `;

    painel.innerHTML = htmlForm;
  }

  function selecionarTier(alvo, tier) {
    meusVotosLocais[alvo] = tier;
    renderizarVotacao();
  }

  async function enviarMeusVotos() {
    const meuNick = document.getElementById('meuUsuario').value;
    const outros = todosJogadores.filter(j => j.nome.toLowerCase() !== meuNick.toLowerCase());

    if (Object.keys(meusVotosLocais).length < outros.length) {
      return alert("Vote no Tier de todos os jogadores antes de salvar!");
    }

    for (const alvo in meusVotosLocais) {
      const tier = meusVotosLocais[alvo];
      await fetch(`/api/votar?alvo=${encodeURIComponent(alvo)}&tier=${tier}`, { method: 'POST' });
    }

    alert('🎉 Seus votos foram salvos no servidor!');
    meusVotosLocais = {};
    renderizarVotacao();
    atualizarStatusVotacaoGeral();
  }

  function iniciarChecagemVotos() {
    if (!intervalVotos) {
      atualizarStatusVotacaoGeral();
      intervalVotos = setInterval(atualizarStatusVotacaoGeral, 2000);
    }
  }

  function pararChecagemVotos() {
    if (intervalVotos) {
      clearInterval(intervalVotos);
      intervalVotos = null;
    }
  }

  async function atualizarStatusVotacaoGeral() {
    try {
      const res = await fetch('/api/votos-concluidos-count');
      if (!res.ok) return;
      const count = await res.json();

      document.getElementById('contadorVotosConcluidos').innerText = `${count}/10`;
      const btn = document.getElementById('btnConfirmarEGerar');

      if (count >= 10) {
        btn.disabled = false;
        btn.classList.remove('btn-secondary');
        btn.classList.add('btn-success');
        btn.innerHTML = '<i class="bi bi-rocket-takeoff-fill"></i> Todos votaram! Gerar Equipes Agora';
      } else {
        btn.disabled = true;
        btn.innerHTML = `<i class="bi bi-lock-fill"></i> Aguardando todos os jogadores votarem (${count}/10)...`;
      }
    } catch (e) {
      console.error(e);
    }
  }

  async function irParaTimes() {
    await balancear();
    carregar();
  }

  async function balancear() {
    const res = await fetch('/api/balancear');
    if (!res.ok) {
      const err = await res.text();
      return alert('Aviso: ' + err);
    }
    const times = await res.json();
    ultimaPartida = times;

    const ctList = document.getElementById('timeCT');
    const trList = document.getElementById('timeTR');
    ctList.innerHTML = '';
    trList.innerHTML = '';

    times[0].jogadores.forEach(j => ctList.innerHTML += `<li class="list-group-item bg-dark text-light border-secondary"><i class="bi bi-person-fill text-info me-2"></i>${j.nome}</li>`);
    times[1].jogadores.forEach(j => trList.innerHTML += `<li class="list-group-item bg-dark text-light border-secondary"><i class="bi bi-person-fill text-warning me-2"></i>${j.nome}</li>`);
  }

  function copiarParaDiscord() {
    if (!ultimaPartida) return;

    const ct = ultimaPartida[0];
    const tr = ultimaPartida[1];

    let texto = `⚔️ **PARTIDA CS2 GERADA** ⚔️\n\n`;
    texto += `🛡️ **${ct.nome.toUpperCase()}**\n`;
    if (ct && ct.jogadores) ct.jogadores.forEach(j => texto += `• ${j.nome}\n`);

    texto += `\n💣 **${tr.nome.toUpperCase()}**\n`;
    if (tr && tr.jogadores) tr.jogadores.forEach(j => texto += `• ${j.nome}\n`);

    navigator.clipboard.writeText(texto).then(() => {
      alert("Escalação copiada para a área de transferência!");
    });
  }

  async function limparLobby() {
    if (!confirm("Tem certeza que deseja resetar a sala?")) return;

    await fetch('/api/resetar', { method: 'POST' });
    meusVotosLocais = {};
    ultimaPartida = null;
    pararChecagemVotos();
    carregar();
  }

  carregar();
</script>

<!-- Bootstrap JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
